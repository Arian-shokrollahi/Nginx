# اصلا فایل nginx.conf چی است؟
فایل **nginx.conf** فایل اصلی تنظیمات Nginx است. این فایل مشخص می‌کند Nginx درخواست‌ها را چگونه دریافت و پردازش کند؛ مثلاً روی چه پورتی گوش بدهد، فایل‌های سایت را از کجا بخواند و درخواست‌ها را به کدام برنامه بفرستد.

بخش‌های رایج آن:

|بخش|نقش|
|---|---|
|`events`|تنظیم نحوه مدیریت اتصال‌ها|
|`http`|تنظیمات مربوط به ترافیک HTTP و وب‌سایت‌ها|
|`server`|تعریف یک سایت یا سرویس با پورت و نام دامنه|
|`location`|تعیین رفتار Nginx برای مسیرهایی مثل `/` یا `/api/`|-

- حالا جلوتر رفتیم درمورد بخش هایه اون بیشتر بهتون توضیح میدهم که به چه صورت است

---
#### بریم یه مثال و توضیحش هم ببنیم 
برای مثال، این تنظیمات درخواست‌های پورت `80` را به برنامه‌ای روی پورت `3000` می‌فرستد:

```
events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://127.0.0.1:3000;
        }
    }
}
```

در این مثال:

- ا-`worker_connections 1024` تعداد اتصال‌های مجاز برای هر پردازش worker را تعیین می‌کند.
- ا-`listen 80` یعنی Nginx روی پورت ۸۰ درخواست دریافت کند.
- ا-`server_name localhost` نام میزبان مربوط به این تنظیمات را مشخص می‌کند.
- ا-`location /` درخواست مسیر `/` و مسیرهای زیر آن را مدیریت می‌کند.
- ا-`proxy_pass` درخواست را به برنامه مقصد می‌فرستد؛ این همان نقش **Reverse Proxy** است.

در **Docker**، اگر برنامه داخل کانتینر جداگانه‌ای باشد، معمولاً از نام سرویس استفاده می‌کنی:

```
proxy_pass http://app:3000;
```

اینجا `app` نام سرویس برنامه در Docker Compose است و دو سرویس باید شبکه مشترک داشته باشند. آدرس `127.0.0.1` داخل کانتینر Nginx به همان کانتینر اشاره می‌کند.


